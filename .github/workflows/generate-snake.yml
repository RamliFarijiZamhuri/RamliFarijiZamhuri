name: Generate Snake

on:
  schedule:
    # Mengonversi otomatis setiap 24 jam
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches:
    - main

jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Membuat animasi ular berdasarkan kontribusi GitHub
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v4
        with:
          github_user_name: RamliFarijiZamhuri
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353

      # Deploy file SVG yang dihasilkan ke branch output
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
