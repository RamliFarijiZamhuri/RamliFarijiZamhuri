name: Generate Snake

on:
  # Berjalan otomatis setiap 6 jam
  schedule:
    - cron: "0 */6 * * *"
  
  # Mengizinkan kamu menjalankan script ini secara manual kapan saja dari tab Actions
  workflow_dispatch:
  
  # Berjalan otomatis setiap kali kamu melakukan push sesuatu ke branch main
  push:
    branches:
      - main
    
jobs:
  generate:
    permissions: 
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # Menggunakan versi v3 yang valid dengan parameter kustomisasi yang didukung
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk@v3
        with:
          github_user_name: RamliFarijiZamhuri
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#ffffff&color_dots=#161b22,#0e4429,#006d32,#26a641,#39d353
          
      # Push content file dari folder dist ke branch bernama 'output' secara otomatis
      - name: push github-contribution-grid-snake.svg to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
